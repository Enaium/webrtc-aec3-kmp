name: Test

"on":
  workflow_dispatch:

# Publishes every artifact to the local Maven repository and runs the test
# suites for each platform. Each matrix entry covers the artifacts that its
# runner can build:
#
#   macOS ARM64    -> :aec3 (multiplatform module), darwin JNI, JVM + native tests
#   Linux x64      -> linux JNI (x86_64 + aarch64 cross), JVM + native tests
#   Windows x64    -> windows JNI (MinGW), JVM + native tests
#   Android        -> publish to Maven Local, assemble + instrumented tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS ARM64
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish all platforms to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          :aec3:publishToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :aec3:jvmTest

      - name: Run native tests
        run: ./gradlew --no-daemon :aec3:macosArm64Test

  test-linux:
    name: Test Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install aarch64-linux-gnu cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish linux JNI to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-linux-aarch64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :aec3:jvmTest

      - name: Compile native klib (linuxX64)
        # webrtc-aec3 requires C++20 (std::span), but Kotlin/Native's Linux
        # toolchain ships gcc-8.3/libstdc++ which cannot link the test binary.
        # Compiling the klib (bindings) still validates the target.
        run: ./gradlew --no-daemon :aec3:compileKotlinLinuxX64

  test-windows:
    name: Test Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # The JVM needs MinGW's runtime DLLs (libwinpthread-1.dll,
          # libgcc_s_seh-1.dll) on PATH to load the JNI DLL.
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish windows JNI to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Inspect JNI jar contents
        shell: pwsh
        run: |
          jar tf jni/jvm/windows-x86_64/build/libs/jni-jvm-windows-x86_64-1.0-SNAPSHOT.jar

      - name: Run JVM tests
        run: ./gradlew --no-daemon --stacktrace :aec3:jvmTest

      - name: Compile native klib (mingwX64)
        # Same toolchain limitation as linuxX64 (gcc-8.3, no C++20).
        run: ./gradlew --no-daemon :aec3:compileKotlinMingwX64

  test-android:
    name: Test Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish all platforms to Maven Local
        run: ./gradlew --no-daemon --stacktrace :aec3:publishToMavenLocal

      - name: Assemble Android app
        run: ./gradlew --no-daemon :example:assembleDebug

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: arm64-v8a
          target: default
          script: ./gradlew :example:connectedDebugAndroidTest
